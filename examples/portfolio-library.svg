<g font-family="Arial,sans-serif" text-anchor="middle" fill="#143747"><text x="460" y="133" font-size="40" font-weight="700">1. Arrival</text><text x="460" y="181" font-size="27">A clear welcome and floor guide</text><text x="460" y="358" font-size="40" font-weight="700">2. Discovery</text><text x="460" y="406" font-size="27">Find a section without asking</text><text x="460" y="583" font-size="40" font-weight="700">3. Quiet reading</text><text x="460" y="631" font-size="27">Choose a space that fits</text><text x="500" y="744" font-size="28">Listen → test the signs → improve</text></g>
