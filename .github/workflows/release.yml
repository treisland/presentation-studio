name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag version
        run: node -e 'const v=require("./package.json").version; if(process.env.GITHUB_REF_NAME!=="v"+v) throw new Error("Tag must match package.json version")'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run package
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/presentation-studio.html dist/presentation-studio-blank.html release/*.zip --draft --title "Presentation Studio $GITHUB_REF_NAME" --notes-file CHANGELOG.md
