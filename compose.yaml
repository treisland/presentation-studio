services:
  studio:
    build:
      context: .
      target: source
      args:
        VERSION: ${VERSION:-development}
        REVISION: ${REVISION:-unknown}
    ports:
      - "127.0.0.1:4173:8080"
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    restart: unless-stopped
